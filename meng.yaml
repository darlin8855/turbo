rules:
  - 'GEOSITE,private,DIRECT'
  # 国内直连：不绕美国 worker，速度快，且省下 CF 每天的请求额度（免费版每 worker 10 万/天）
  - 'GEOSITE,cn,DIRECT'
  - 'GEOIP,CN,DIRECT'
  - 'IP-CIDR,127.0.0.0/8,DIRECT,no-resolve'
  - 'IP-CIDR,10.0.0.0/8,DIRECT,no-resolve'
  - 'IP-CIDR,172.16.0.0/12,DIRECT,no-resolve'
  - 'IP-CIDR,192.168.0.0/16,DIRECT,no-resolve'
  # 拦截境外 QUIC（UDP 443），强制浏览器回落 TCP/TLS。
  # YouTube / Google 默认走 HTTP/3，而 CF Workers 的 UDP 转发极不可靠，
  # 浏览器会卡在 QUIC 上反复重试，带宽直接掉到几百 kbps。
  # 放在国内直连规则之后 —— 国内站点的 QUIC 不受影响。
  - 'AND,((NETWORK,UDP),(DST-PORT,443)),REJECT'
  - 'MATCH,免费节点 MENGvpn 选择'
