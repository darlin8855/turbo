# 免费节点 MENGvpn —— Clash / mihomo 配置  【发布版 · 给用户】
# 7 条线路：A–D 为优选域名池（各 8 节点），E 为非 CF 节点（各保留原地址）
# 默认走「全池均衡」；哪个入口对你这地区快，就在客户端里切到对应线路。
# 全池均衡：按目标域名哈希摊到全部 51 个出站上。
# 线路 C/D/E/F/G：每条是一套独立入口，组内仍是负载均衡（20 个节点分摊）。
# A组 美国流媒体（5 个）/ B组 英国流媒体（1 个）：hysteria2 专用节点。
mixed-port: 7890
allow-lan: false
mode: rule
log-level: warning
# 控制接口：没有它就没有面板，看不到「连接」页和日志
external-controller: 127.0.0.1:9090
ipv6: false
unified-delay: true
tcp-concurrent: true

dns:
  enable: true
  ipv6: false
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  # 代理服务器地址绝不能走 fake-ip，否则永远连不上（安卓上尤其致命）
  fake-ip-filter:
    - '*.lan'
    - '*.local'
    - '+.msftconnecttest.com'
    - '+.msftncsi.com'
    - '+.877774.xyz'
    - '+.xxxxxxxx.tk'
    - '+.130519.xyz'
    - '+.3666888.xyz'
    - '+.5199dy.com'
    - '+.090227.xyz'
    - 'cf.877774.xyz'
    - 'cfip.xxxxxxxx.tk'
    - 'cf.130519.xyz'
    - 'cf.3666888.xyz'
    - 'www.5199dy.com'
    - 'cf.090227.xyz'
    - '+.777078.xyz'
    - 'lxyus1.777078.xyz'
    - 'lxyus2.777078.xyz'
    - 'lxyus3.777078.xyz'
    - 'lxyus4.777078.xyz'
  # ★ 关键：代理节点域名的专用解析器。
  # 不配这一项时，mihomo 会走 nameserver + fallback 那套「污染判定」：
  # 优选域名解析出来的是 Cloudflare 境外 IP -> 被 geoip-code=CN 判为污染
  # -> 转去问 fallback(8.8.8.8) -> 国内被墙 -> 超时 -> 所有 CF 线路连不上。
  # 配了它之后，节点域名只用下面这两台国内 DNS 解析，不再触发污染判定。
  proxy-server-nameserver:
    - 'https://223.5.5.5/dns-query'
    - 'https://1.12.12.12/dns-query'
  nameserver:
    - 'https://223.5.5.5/dns-query'
    - 'https://1.12.12.12/dns-query'
  # 刻意不配 fallback：境外 DoH 在国内不可达，只会给每次查询加超时。
  # 被墙域名走 fake-ip + 代理，本地本来就不需要解析出真实 IP。

